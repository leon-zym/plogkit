name: Mobile simulator E2E

on:
  schedule:
    # Monday 02:30 Asia/Shanghai (Sunday 18:30 UTC).
    - cron: "30 18 * * 0"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      flow:
        description: Optional flow basename, for example f06-session-persistence
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  ios-maestro:
    name: iOS Maestro acceptance suite
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-26
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - run: pnpm install --frozen-lockfile
      - name: Install Maestro CLI
        run: |
          MAESTRO_VERSION="$(< .maestro-version)"
          MAESTRO_ARCHIVE="$RUNNER_TEMP/maestro-$MAESTRO_VERSION"
          mkdir -p "$MAESTRO_ARCHIVE"
          curl -fsSL -o "$MAESTRO_ARCHIVE/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          curl -fsSL -o "$MAESTRO_ARCHIVE/checksums_sha256.txt" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/checksums_sha256.txt"
          (cd "$MAESTRO_ARCHIVE" && shasum -a 256 -c checksums_sha256.txt)
          unzip -q "$MAESTRO_ARCHIVE/maestro.zip" -d "$MAESTRO_ARCHIVE"
          echo "$MAESTRO_ARCHIVE/maestro/bin" >> "$GITHUB_PATH"
      - name: Run iOS standalone Release acceptance
        run: pnpm e2e:ios
        timeout-minutes: 135
        env:
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/plogkit-e2e-private
          E2E_PUBLIC_ARTIFACTS_DIR: ${{ runner.temp }}/plogkit-e2e
          E2E_FLOW: ${{ inputs.flow }}
          E2E_IOS_RUNNER_LABEL: macos-26
      - name: Upload iOS observations and failure artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-maestro-artifacts
          if-no-files-found: warn
          path: ${{ runner.temp }}/plogkit-e2e
          retention-days: 7

  android-maestro:
    name: Android Maestro acceptance suite
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      E2E_ANDROID_ARCH: x86_64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - run: pnpm install --frozen-lockfile
      - name: Install Maestro CLI
        run: |
          MAESTRO_VERSION="$(< .maestro-version)"
          MAESTRO_ARCHIVE="$RUNNER_TEMP/maestro-$MAESTRO_VERSION"
          mkdir -p "$MAESTRO_ARCHIVE"
          curl -fsSL -o "$MAESTRO_ARCHIVE/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          curl -fsSL -o "$MAESTRO_ARCHIVE/checksums_sha256.txt" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/checksums_sha256.txt"
          (cd "$MAESTRO_ARCHIVE" && shasum -a 256 -c checksums_sha256.txt)
          unzip -q "$MAESTRO_ARCHIVE/maestro.zip" -d "$MAESTRO_ARCHIVE"
          echo "$MAESTRO_ARCHIVE/maestro/bin" >> "$GITHUB_PATH"
      - name: Install Android Emulator host libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0
      - name: Install Android E2E emulator and system image
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "cmdline-tools;22.0" \
            "emulator" \
            "platform-tools" \
            "system-images;android-36;default;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android standalone Release acceptance
        run: pnpm e2e:android
        timeout-minutes: 135
        env:
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/plogkit-e2e
          E2E_FLOW: ${{ inputs.flow }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-maestro-artifacts
          if-no-files-found: warn
          path: ${{ runner.temp }}/plogkit-e2e
