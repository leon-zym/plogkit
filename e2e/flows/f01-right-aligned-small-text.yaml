appId: com.leonzym.plogkit
name: Right-aligned small text uses an extended touch target
tags:
  - F01-S13
  - F01-S14
---
- runFlow: ../subflows/import-two-photos.yaml
- tapOn:
    id: editor-tool-text
- assertVisible: Add text
- tapOn:
    id: text-input
- setClipboard: 右
- pasteText
- runFlow: ../subflows/dismiss-keyboard.yaml
- assertVisible:
    id: text-input
    text: 右
- runFlow:
    file: ../subflows/scroll-editor-panel-until-visible.yaml
    env:
      TARGET_ID: text-preset-caption
- tapOn:
    id: text-preset-caption
- runFlow:
    file: ../subflows/assert-radio-checked.yaml
    env:
      OPTION_ID: text-preset-caption
- runFlow:
    file: ../subflows/scroll-editor-panel-until-visible.yaml
    env:
      TARGET_ID: text-alignment-right
- tapOn:
    id: text-alignment-right
- runFlow:
    file: ../subflows/assert-radio-checked.yaml
    env:
      OPTION_ID: text-alignment-right
- runFlow: ../subflows/scroll-and-apply-text-edits.yaml
- assertVisible:
    id: select-new-text
- tapOn:
    id: select-new-text
- assertNotVisible:
    id: canvas-text-selection-.*
- tapOn:
    id: canvas-text-hit-0-.*
- assertVisible:
    id: canvas-text-hit-0-.*
    selected: true
- assertVisible:
    id: canvas-text-selection-.*
- swipe:
    from:
      id: canvas-text-hit-0-.*
    direction: LEFT
    duration: 500
- tapOn:
    id: editor-undo
- assertVisible:
    id: canvas-text-hit-0-.*
