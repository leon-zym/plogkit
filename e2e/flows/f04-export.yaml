appId: com.leonzym.plogkit
name: Export from the document with a one-time metadata override
tags:
  - F04-S02
  - F04-S08
  - F04-S13
  - F04-S16
---
- runFlow: ../subflows/import-two-photos.yaml
- tapOn:
    id: editor-open-export
- assertVisible: Export
- tapOn:
    id: export-preset-social
- tapOn:
    id: export-retain-basic
- runFlow:
    file: ../subflows/scroll-editor-panel-until-visible.yaml
    env:
      TARGET_ID: export-document
- tapOn:
    id: export-document
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: ^Allow$
          timeout: 10000
      - tapOn: ^Allow$
- extendedWaitUntil:
    visible:
      id: export-success
    timeout: 60000
- assertVisible: Saved to Photos
- runScript:
    file: ../scripts/assert-export-photo.js
    env:
      EXPORT_INDEX: "1"
- tapOn:
    id: editor-tool-text
- tapOn:
    id: text-input
- setClipboard: "导出后更新 ✨"
- pasteText
- runFlow: ../subflows/dismiss-keyboard.yaml
- runFlow: ../subflows/scroll-and-apply-text-edits.yaml
- assertVisible: "导出后更新 ✨"
- tapOn:
    id: editor-open-export
- runFlow:
    file: ../subflows/scroll-editor-panel-until-visible.yaml
    env:
      TARGET_ID: export-document
- tapOn:
    id: export-document
- extendedWaitUntil:
    visible:
      id: export-success
    timeout: 60000
- assertVisible: Saved to Photos
- runScript:
    file: ../scripts/assert-export-photo.js
    env:
      EXPORT_INDEX: "2"
